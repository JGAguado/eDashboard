; PlatformIO Configuration for eDashboard
; Seeed Studio reTerminal E1002 (ESP32-S3 + 7.3" Spectra 6 ePaper)

[platformio]
; Use a short build dir to avoid Windows MAX_PATH issues with GxEPD2
build_dir = C:/_pio

[env:e1002]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; --- Build settings ---
board_build.psram = enable
board_build.arduino.memory_type = qio_opi
build_type = release
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_LOOP_STACK_SIZE=32768
    -std=gnu++17
    -Wall

; --- Serial monitor ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Upload ---
upload_speed = 921600

; --- Library dependencies ---
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    bblanchon/ArduinoJson@^7.4.0

; --- Pre-build script: generate secrets_gen.h from secrets.yaml ---
extra_scripts = pre:scripts/generate_secrets.py
