# ============================================================
# eDashboard Configuration
# ============================================================
# Fill in the values below and save before building.
# This file is parsed at build-time and compiled into firmware.
# DO NOT commit this file to version control with real secrets.
# ============================================================

# --- WiFi ---
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# --- Location (decimal degrees) ---
latitude: 40.4168
longitude: -3.7038
altitude: 650

# --- OpenWeatherMap (air quality only) ---
# Get a free API key at https://openweathermap.org/api
openweathermap_api_key: "YOUR_OWM_API_KEY"

# --- Google Calendar ---
# Use the secret .ics address from Google Calendar:
#   Calendar Settings > Integrate calendar > Secret address in iCal format
# Example: https://calendar.google.com/calendar/ical/abc123%40group.calendar.google.com/private-xyz/basic.ics
google_ical_url: "YOUR_GOOGLE_ICAL_URL"

# --- Time ---
# POSIX timezone string. Examples:
#   CET-1CEST,M3.5.0,M10.5.0/3   (Central Europe)
#   GMT0BST,M3.5.0/1,M10.5.0      (UK)
#   EST5EDT,M3.2.0,M11.1.0         (US Eastern)
#   PST8PDT,M3.2.0,M11.1.0         (US Pacific)
timezone: "CET-1CEST,M3.5.0,M10.5.0/3"
ntp_server: "pool.ntp.org"

# --- Display preferences ---
# Temperature unit: "C" for Celsius, "F" for Fahrenheit
temp_unit: "C"

# Wind speed unit: "km/h", "mph", "m/s", or "knots"
wind_unit: "km/h"

# --- Server-client image backend ---
# URL serving the packed binary image for ESP32 pull mode.
# Replace with your computer's LAN IP (not localhost) if ESP32 is on WiFi.
backend_image_url: "http://192.168.1.100:8090/latest/bin"

# --- Sleep settings ---
# Night mode: during these hours the device stays asleep (24h format).
# Set both to the same value to disable night mode.
# Example: start=23, end=7 means sleep from 23:00 to 07:00
night_mode_start: 23
night_mode_end: 7

# Sleep interval during daytime (in minutes).
# The device wakes, refreshes, and goes back to sleep for this duration.
sleep_minutes: 30
